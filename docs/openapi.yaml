components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Flask session cookie
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 기본 30, 최대 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Offset:
      name: offset
      in: query
      required: false
      description: 기본 0
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
  schemas:
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SkillLevel:
      type: string
      enum:
        - BRONZE
        - SILVER
        - GOLD
        - MASTER
    MeetingStatus:
      type: string
      enum:
        - RECRUITING
        - CLOSED
        - COMPLETED
        - CANCELED
    ApprovalType:
      type: string
      enum:
        - INSTANT
        - APPROVAL
    ParticipationStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - WAITING
        - CANCELED
        - REJECTED
        - KICKED
    AttendanceStatus:
      type: string
      enum:
        - ATTENDED
        - NO_SHOW
    SignupRequest:
      type: object
      required:
        - login_id
        - password
        - nickname
        - email
        - birth_date
        - region
        - gender
      properties:
        login_id:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        nickname:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
        region:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
    LoginRequest:
      type: object
      required:
        - login_id
        - password
      properties:
        login_id:
          type: string
        password:
          type: string
          format: password
    UserMe:
      type: object
      properties:
        user_id:
          type: integer
        role:
          type: string
          enum:
            - USER
            - ADMIN
        login_id:
          type: string
        nickname:
          type: string
        email:
          type: string
          format: email
        profile_image:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
        gender:
          type: string
        region:
          type: string
    PublicUser:
      type: object
      additionalProperties: true
      properties:
        user_id:
          type: integer
        nickname:
          type: string
        profile_image:
          type: string
          nullable: true
        region:
          type: string
    Sport:
      type: object
      required:
        - sport_id
        - sport_name
      properties:
        sport_id:
          type: integer
        sport_name:
          type: string
    UserSport:
      type: object
      properties:
        sport_id:
          type: integer
        sport_name:
          type: string
        skill_level:
          $ref: '#/components/schemas/SkillLevel'
    MeetingInput:
      type: object
      required:
        - title
        - description
        - sport_id
        - meeting_date
        - meeting_time
        - end_time
        - location
        - max_participants
        - approval_type
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        sport_id:
          type: integer
          minimum: 1
        meeting_date:
          type: string
          format: date
        meeting_time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '19:00'
        end_time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '21:00'
        location:
          type: string
          minLength: 1
        max_participants:
          type: integer
          minimum: 2
        required_skill_level:
          allOf:
            - $ref: '#/components/schemas/SkillLevel'
          nullable: true
        approval_type:
          $ref: '#/components/schemas/ApprovalType'
    Meeting:
      type: object
      properties:
        meeting_id:
          type: integer
        title:
          type: string
        description:
          type: string
        sport_id:
          type: integer
        sport_name:
          type: string
        host_id:
          type: integer
        host_name:
          type: string
        host_profile_image:
          type: string
          nullable: true
        meeting_date:
          type: string
        meeting_time:
          type: string
        end_time:
          type: string
        location:
          type: string
        max_participants:
          type: integer
        required_skill_level:
          allOf:
            - $ref: '#/components/schemas/SkillLevel'
          nullable: true
        approval_type:
          $ref: '#/components/schemas/ApprovalType'
        status:
          $ref: '#/components/schemas/MeetingStatus'
        created_at:
          type: string
        updated_at:
          type: string
        approved_count:
          type: integer
        participant_count:
          type: integer
        remaining_slots:
          type: integer
        my_participation_status:
          type: string
          nullable: true
          enum:
            - HOST
            - APPROVED
            - PENDING
            - WAITING
    ChatRoom:
      type: object
      additionalProperties: true
    ChatMessage:
      type: object
      additionalProperties: true
    Notification:
      type: object
      additionalProperties: true
    Report:
      type: object
      additionalProperties: true
    AdminUser:
      type: object
      additionalProperties: true
x-socketio-events:
  namespace: /
  authentication: Flask session cookie (session)
  client_events:
    connect:
      description: 로그인된 ACTIVE 사용자만 연결 가능
    join_room:
      payload:
        chat_room_id: integer
      description: 채팅방 멤버만 입장
    leave_room:
      payload:
        chat_room_id: integer
      description: 채팅방 멤버만 퇴장
    send_message:
      payload:
        chat_room_id: integer
        content: string (1~10000 chars)
      description: 채팅방 멤버만 전송
    disconnect:
      description: 연결 종료
  server_events:
    - connected
    - joined_room
    - left_room
    - receive_message
    - error
