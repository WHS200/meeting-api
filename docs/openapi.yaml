openapi: 3.0.3
info:
  title: YANAWA API
  version: 1.0.0
  description: 'WHS200 YANAWA 서비스의 HTTP API 명세입니다.


    기준 소스: GitHub main / PR #10 병합 커밋 d33a7ae31a4952dc6875b57c491e681bb8835304.


    Flask session cookie를 인증에 사용합니다. ADMIN 전용 API는 x-required-role: ADMIN으로 표시합니다. Socket.IO 이벤트는 OpenAPI HTTP path가 아니므로
    문서 마지막의 x-socketio-events 확장 필드에 별도로 기록했습니다.'
servers:
  - url: https://yanawa.kr
    description: Production
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Users
  - name: Sports
  - name: Meetings
  - name: Participation
  - name: Waitlist
  - name: Chat
  - name: Friends
  - name: Blocks
  - name: Community
  - name: Reports
  - name: Notifications
  - name: Favorites
  - name: Stats
  - name: Sport Proposals
  - name: Admin
paths:
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: registered.
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '409':
          description: 현재 상태 또는 중복 요청과 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Conflicting request.
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login Success.
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      operationId: logout
      security: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Logout success.
  /api/users/me:
    get:
      tags:
        - Users
      summary: 내 프로필 조회
      operationId: getMe
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
    patch:
      tags:
        - Users
      summary: 내 프로필 수정
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname:
                  type: string
                region:
                  type: string
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '409':
          description: 현재 상태 또는 중복 요청과 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Conflicting request.
    delete:
      tags:
        - Users
      summary: 계정 삭제
      operationId: deleteMe
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
  /api/users/{user_id}:
    get:
      tags:
        - Users
      summary: 상대 프로필 조회
      operationId: getUserProfile
      parameters:
        - name: user_id
          in: path
          required: true
          description: 조회할 사용자 ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 사용자 프로필
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
  /api/users/me/password:
    patch:
      tags:
        - Users
      summary: 비밀번호 변경
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
  /api/users/me/profile-image:
    post:
      tags:
        - Users
      summary: 프로필 이미지 등록 또는 변경
      operationId: uploadProfileImage
      description: jpg/jpeg/png/webp만 허용. 최대 실제 파일 크기 5MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile_image
              properties:
                profile_image:
                  type: string
                  format: binary
      responses:
        '200':
          description: 이미지 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile_image:
                    type: string
                    nullable: true
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '413':
          description: 업로드 크기 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Payload too large.
  /api/sports:
    get:
      tags:
        - Sports
      summary: 활성 운동 종목 전체 조회
      operationId: getSports
      security: []
      responses:
        '200':
          description: 활성 종목 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sport'
  /api/users/me/sports:
    get:
      tags:
        - Sports
      summary: 내 운동 프로필 조회
      operationId: getMySports
      responses:
        '200':
          description: 내 운동 종목
          content:
            application/json:
              schema:
                type: object
                properties:
                  sports:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSport'
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
    post:
      tags:
        - Sports
      summary: 내 운동 종목 추가
      operationId: addMySport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sport_id
                - skill_level
              properties:
                sport_id:
                  type: integer
                  minimum: 1
                skill_level:
                  $ref: '#/components/schemas/SkillLevel'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
        '409':
          description: 현재 상태 또는 중복 요청과 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Conflicting request.
  /api/users/me/sports/{sport_id}:
    patch:
      tags:
        - Sports
      summary: 내 운동 실력 수정
      operationId: updateMySport
      parameters:
        - name: sport_id
          in: path
          required: true
          description: 운동 종목 ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skill_level
              properties:
                skill_level:
                  $ref: '#/components/schemas/SkillLevel'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
    delete:
      tags:
        - Sports
      summary: 내 운동 종목 삭제
      operationId: deleteMySport
      parameters:
        - name: sport_id
          in: path
          required: true
          description: 운동 종목 ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
  /api/users/me/stats:
    get:
      tags:
        - Stats
      summary: 내 활동 통계 조회
      operationId: getMyStats
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  participation_count:
                    type: integer
                  attended_count:
                    type: integer
                  no_show_count:
                    type: integer
                  attendance_rate:
                    type: number
                    nullable: true
                  hosted_count:
                    type: integer
                  friend_count:
                    type: integer
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
  /api/users/{user_id}/stats:
    get:
      tags:
        - Stats
      summary: 사용자 활동 통계 조회
      operationId: getUserStats
      parameters:
        - name: user_id
          in: path
          required: true
          description: 식별자
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  participation_count:
                    type: integer
                  attended_count:
                    type: integer
                  no_show_count:
                    type: integer
                  attendance_rate:
                    type: number
                    nullable: true
                  hosted_count:
                    type: integer
                  friend_count:
                    type: integer
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
  /api/meetings:
    get:
      tags:
        - Meetings
      summary: 모임 목록 조회
      operationId: getMeetings
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 제목/설명 검색
        - name: sport_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MeetingStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 모임 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  meetings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Meeting'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
                  total_pages:
                    type: integer
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
    post:
      tags:
        - Meetings
      summary: 모임 생성
      operationId: createMeeting
      description: 시작 시각은 미래여야 하며 end_time은 같은 날짜에서 30분~12시간 범위여야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingInput'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  meeting_id:
                    type: integer
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Bad request.
        '401':
          description: 로그인 필요 또는 세션 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Login first.
        '403':
          description: 권한 없음 또는 계정 정지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not authorized.
        '404':
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Not found.
        '409':
          description: 현재 상태 또는 중복 요청과 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Conflicting request.
        '415':
          description: 지원하지 않는 Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Content-Type should be JSON.
  /api/meetings/mine:
    get:
      tags:
        - Meetings
      summary: 내가 만들거나 참여 중인 모임 조회
      operationId: getMyMeetings
      responses:
        '200':
          description: 내 모임
          content:
            application/json:
              schema:
                type: object
                properties:
                  meetings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Meeting'
                  total:
                    type: integer
        '401':
          description: 로그인 필요 또는 세션 무효
