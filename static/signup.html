<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>회원가입 | PLAYUPP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="signup">
    <main class="auth-page">
      <section class="auth-card wide">
        <div class="brand">PLAY<span>UPP</span></div>
        <h1>회원가입</h1>
        <p class="muted">현재 백엔드 회원가입 API가 받는 항목만 입력합니다.</p>
        <form id="signupForm">
          <div class="form-grid">
            <div class="field">
              <label>아이디</label><input name="login_id" required />
            </div>
            <div class="field">
              <label>닉네임</label><input name="nickname" required />
            </div>
            <div class="field">
              <label>비밀번호</label
              ><input name="password" type="password" minlength="8" required />
            </div>
            <div class="field">
              <label>비밀번호 확인</label
              ><input
                name="password_confirm"
                type="password"
                minlength="8"
                required
              />
            </div>
            <div class="field">
              <label>이메일</label><input name="email" type="email" required />
            </div>
            <div class="field">
              <label>생년월일</label
              ><input name="birth_date" type="date" required />
            </div>
            <div class="field">
              <label>성별</label>
              <select name="gender" required>
                <option value="MALE">MALE</option>
                <option value="FEMALE">FEMALE</option>
              </select>
            </div>
            <div class="field">
              <label>활동 지역</label
              ><input name="region" placeholder="예: 인천 검단구" required />
            </div>
            <div class="field full">
              <button class="btn blue block" type="submit">회원가입</button>
            </div>
          </div>
        </form>
        <div id="formStatus" class="status"></div>
        <div class="auth-footer">
          이미 계정이 있나요? <a href="login.html">로그인</a>
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
