<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>회원가입 | PLAYUPP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="signup">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <a href="index.html"
            ><span class="brand-mark">PLAY<span>UPP</span></span></a
          >
        </div>
        <h1>회원가입</h1>
        <form id="signupForm">
          <div class="field">
            <label>아이디</label><input name="login_id" required />
          </div>
          <div class="field">
            <label>비밀번호</label
            ><input name="password" type="password" minlength="8" required />
          </div>
          <div class="field">
            <label>비밀번호 확인</label
            ><input
              name="password_confirm"
              type="password"
              minlength="8"
              required
            />
          </div>
          <div class="field">
            <label>닉네임</label><input name="nickname" required />
          </div>
          <div class="field">
            <label>이메일</label><input name="email" type="email" required />
          </div>
          <div class="field">
            <label>생년월일</label
            ><input name="birth_date" type="date" required />
          </div>
          <div class="field">
            <label>성별</label
            ><select name="gender">
              <option value="MALE">남성</option>
              <option value="FEMALE">여성</option>
            </select>
          </div>
          <div class="field">
            <label>지역</label><input name="region" required />
          </div>
          <button class="btn blue block">가입하기</button>
          <div id="formStatus" class="status"></div>
        </form>
        <div class="auth-links">
          <a href="login.html">이미 계정이 있어요</a>
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
