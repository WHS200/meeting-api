<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>모임 찾기 | PLAYUPP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">PLAY<span>UPP</span></span></a
        >
        <nav class="main-nav">
          <a class="active" href="index.html">모임 찾기</a
          ><a href="create.html">모임 생성</a
          ><a href="my-meetings.html">내가 만든 모임</a
          ><a href="chat.html">채팅</a>
        </nav>
        <div class="top-actions">
          <form class="search-box" data-global-search>
            <input
              name="keyword"
              type="search"
              placeholder="모임 검색"
            /><button aria-label="검색">⌕</button>
          </form>
          <a class="btn sm" data-auth-guest href="login.html">로그인</a
          ><a data-auth-user hidden href="profile.html"
            ><span class="avatar" data-user-initial>?</span></a
          >
        </div>
      </div>
    </header>
    <main class="shell">
      <div class="content-grid">
        <aside class="panel filter-panel">
          <h2>상세 검색</h2>
          <form id="filterForm" class="filter-stack">
            <div class="field">
              <label>키워드</label
              ><input name="keyword" placeholder="제목 또는 설명" />
            </div>
            <div class="field">
              <label>운동 종목</label
              ><select name="sport_id">
                <option value="">전체 종목</option>
              </select>
            </div>
            <div class="field">
              <label>날짜</label><input name="date" type="date" />
            </div>
            <div class="field">
              <label>지역</label
              ><input name="location" placeholder="예: 인천" />
            </div>
            <div class="field">
              <label>모임 상태</label
              ><select name="status">
                <option value="">전체 상태</option>
                <option value="RECRUITING">모집 중</option>
                <option value="CLOSED">모집 마감</option>
                <option value="COMPLETED">완료</option>
                <option value="CANCELED">취소</option>
              </select>
            </div>
            <button class="btn primary block">검색</button
            ><button id="resetFilters" type="button" class="btn block">
              초기화
            </button>
          </form>
        </aside>
        <section>
          <div class="hero">
            <span class="eyebrow">생활체육 번개매칭</span>
            <h1>같이 운동할 사람을 찾고,<br />모임에 참여해보세요.</h1>
            <p>
              현재 Meeting API에서 제공하는 종목·날짜·지역·상태 검색만
              연결했습니다.
            </p>
            <div class="hero-art"></div>
          </div>
          <div class="toolbar">
            <h2>모임 목록 <small id="meetingTotal"></small></h2>
            <a class="btn blue" href="create.html">모임 만들기</a>
          </div>
          <div id="meetingList" class="meeting-list">
            <div class="empty">불러오는 중...</div>
          </div>
        </section>
        <aside class="right-rail">
          <section class="card scope-card">
            <h2>사용 가능한 기능</h2>
            <ul>
              <li>모임 검색·상세 조회</li>
              <li>모임 생성·수정·삭제</li>
              <li>참가·승인·강퇴·출석</li>
              <li>실시간 모임 채팅</li>
            </ul>
          </section>
          <section class="card scope-card">
            <h2>참가 방식</h2>
            <p class="muted">
              즉시 승인 또는 모임장 승인 방식으로 참가하고, 승인된 참가자는 모임
              채팅방을 사용할 수 있습니다.
            </p>
          </section>
        </aside>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/meetings.js"></script>
  </body>
</html>
