<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>모임 찾기 | YANAWA!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">YA<span>NAWA<i>!</i></span></span></a
        >
        <nav class="main-nav">
          <a class="active" href="index.html">모임 찾기</a
          ><a href="create.html">모임 생성</a
          ><a href="my-meetings.html">내가 만든 모임</a
          ><a href="chat.html">채팅</a>
        </nav>
        <div class="top-actions">
          <form class="search-box" data-global-search>
            <input
              name="keyword"
              type="search"
              placeholder="모임 검색"
            /><button aria-label="검색">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </form>
          <a class="btn sm" data-auth-guest href="login.html">로그인</a
          ><a data-auth-user hidden href="profile.html"
            ><span class="avatar" data-user-initial>?</span></a
          >
        </div>
      </div>
    </header>
    <main class="shell">
      <div class="content-grid">
        <aside class="panel filter-panel">
          <h2>상세 검색</h2>
          <form id="filterForm" class="filter-stack">
            <div class="field">
              <label>키워드</label
              ><input name="keyword" placeholder="제목 또는 설명" />
            </div>
            <div class="field">
              <label>운동 종목</label
              ><select name="sport_id">
                <option value="">전체 종목</option>
              </select>
            </div>
            <div class="field">
              <label>날짜</label><input name="date" type="date" />
            </div>
            <div class="field">
              <label>지역</label
              ><input name="location" placeholder="예: 인천" />
            </div>
            <div class="field">
              <label>모임 상태</label
              ><select name="status">
                <option value="">전체 상태</option>
                <option value="RECRUITING">모집 중</option>
                <option value="CLOSED">모집 마감</option>
                <option value="COMPLETED">완료</option>
                <option value="CANCELED">취소</option>
              </select>
            </div>
            <button class="btn primary block">검색</button
            ><button id="resetFilters" type="button" class="btn block">
              초기화
            </button>
          </form>
        </aside>
        <section>
          <div class="hero">
            <span class="eyebrow">생활체육 번개매칭</span>
            <h1>같이 운동할 사람을 찾고,<br />모임에 참여해보세요.</h1>
            <p>
              원하는 종목과 시간의 모임을 빠르게 찾아보세요.
            </p>
            <div class="hero-art"></div>
          </div>
          <div class="toolbar">
            <h2>모임 목록 <small id="meetingTotal"></small></h2>
            <a class="btn blue" href="create.html">모임 만들기</a>
          </div>
          <div id="meetingList" class="meeting-list">
            <div class="empty">불러오는 중...</div>
          </div>
        </section>
        <aside class="right-rail">
          <a
            class="instagram-banner"
            href="https://www.instagram.com/u_r_so_min/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="u_r_so_min 인스타그램 방문하기"
          >
            <span class="instagram-banner__label">AD</span>
            <strong>운동은 같이 할 때<br />더 오래 갑니다.</strong>
            <span class="instagram-banner__description"
              >같이 축구할 분 구합니다.<br />연락 주세요.</span
            >
            <span class="instagram-banner__circle" aria-hidden="true"></span>
            <span class="instagram-banner__cta">DM</span>
          </a>
        </aside>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/meetings.js"></script>
  </body>
</html>
