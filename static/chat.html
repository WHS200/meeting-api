<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>채팅 | YANAWA!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">YA<span>NAWA<i>!</i></span></span></a
        >
        <nav class="main-nav">
          <a href="index.html">모임 찾기</a><a href="create.html">모임 생성</a
          ><a href="my-meetings.html">내가 만든 모임</a
          ><a class="active" href="chat.html">채팅</a>
        </nav>
        <div class="top-actions">
          <a data-auth-user hidden href="profile.html"
            ><span class="avatar" data-user-initial>?</span></a
          >
        </div>
      </div>
    </header>
    <main class="page-width">
      <div class="page-head">
        <div>
          <h1>모임 채팅</h1>
        </div>
      </div>
      <section class="chat-layout">
        <aside class="chat-sidebar">
          <div class="chat-sidebar-head"><strong>채팅방</strong></div>
          <section class="chat-room-group"><h3>모임 채팅</h3><div id="meetingRoomList"><div class="empty">모임 채팅방이 없습니다.</div></div></section><section class="chat-room-group"><h3>개인 채팅</h3><div id="directRoomList"><div class="empty">개인 채팅방이 없습니다.</div></div></section>
        </aside>
        <div class="chat-main">
          <header class="chat-main-head">
            <div>
              <strong id="roomTitle">채팅방을 선택하세요</strong>
              <div id="memberList" class="member-list"></div>
            </div>
          </header>
          <div id="messages" class="messages">
            <div class="empty">채팅방을 선택하세요.</div>
          </div>
          <form id="messageForm" class="chat-input">
            <input
              name="content"
              maxlength="2000"
              placeholder="메시지 입력"
              autocomplete="off"
            /><button class="btn blue">전송</button>
          </form>
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
