<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인 | PLAYUPP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <a href="index.html"
            ><span class="brand-mark">PLAY<span>UPP</span></span></a
          >
        </div>
        <h1>로그인</h1>
        <p class="muted">Meeting API 세션 로그인</p>
        <form id="loginForm">
          <div class="field">
            <label>아이디</label
            ><input name="login_id" autocomplete="username" required />
          </div>
          <div class="field">
            <label>비밀번호</label
            ><input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn blue block">로그인</button>
          <div id="formStatus" class="status"></div>
        </form>
        <div class="auth-links">
          <a href="signup.html">회원가입</a><span>·</span
          ><a href="index.html">모임 둘러보기</a>
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
