<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>모임 상세 | YANAWA!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark">YA<span>NAWA<i>!</i></span></span></a
        >
        <nav class="main-nav">
          <a class="active" href="index.html">모임 찾기</a
          ><a href="create.html">모임 생성</a
          ><a href="my-meetings.html">내가 만든 모임</a
          ><a href="chat.html">채팅</a>
        </nav>
        <div class="top-actions">
          <a class="btn sm" data-auth-guest href="login.html">로그인</a
          ><a data-auth-user hidden href="profile.html"
            ><span class="avatar" data-user-initial>?</span></a
          >
        </div>
      </div>
    </header>
    <main class="page-width">
      <div class="detail-grid">
        <section id="detailContent" class="detail-card">
          <div class="empty">모임을 불러오는 중...</div>
        </section>
        <aside class="side-card panel sticky" id="detailSide">
          <div class="empty">확인 중...</div>
        </aside>
      </div>
      <div class="spacer"></div>
      <section id="hostPanel" class="panel" hidden>
        <div class="page-head">
          <div>
            <h1>참가자 관리</h1>
          </div>
        </div>
        <h2>승인 대기</h2>
        <div class="table-wrap">
          <table class="list-table">
            <thead>
              <tr>
                <th>닉네임</th>
                <th>해당 종목 실력</th>
                <th>상태</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="pendingBody"></tbody>
          </table>
        </div>
        <div class="spacer"></div>
        <h2>승인된 참가자</h2>
        <div class="table-wrap">
          <table class="list-table">
            <thead>
              <tr>
                <th>닉네임</th>
                <th>출석</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="approvedBody"></tbody>
          </table>
        </div>
      </section>
      <div id="approvedSummary" class="muted" style="margin-top: 12px"></div>
    </main>
    <dialog id="sportProfileDialog" class="profile-dialog">
      <form id="sportProfileForm">
        <h2>운동 프로필 등록</h2>
        <p class="muted">
          참가 신청 전에 해당 종목의 실력을 등록해 주세요.
        </p>
        <div class="field">
          <label>종목</label>
          <input id="sportProfileName" readonly />
        </div>
        <div class="field">
          <label>실력</label>
          <select name="skill_level" required>
            <option value="BRONZE">입문</option>
            <option value="SILVER">초급</option>
            <option value="GOLD">중급</option>
            <option value="MASTER">고급</option>
          </select>
        </div>
        <div id="sportProfileStatus" class="status"></div>
        <div class="form-actions">
          <button id="sportProfileCancel" class="btn" type="button">취소</button>
          <button class="btn blue" type="submit">등록하고 신청</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/detail.js"></script>
  </body>
</html>
