name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Flask
      SECRET_KEY: test-secret

      # Test database
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: root
      DB_PASSWORD: test-root-password
      DB_NAME: yanawa_codex_test

      # MySQL integration tests
      TEST_MYSQL: "1"
      TEST_MYSQL_PORT: "3307"
      TEST_MYSQL_PASSWORD: test-root-password

      # S3 test environment
      S3_BUCKET_NAME: test-bucket
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: "true"

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: yanawa_codex_test

        ports:
          - 3307:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v